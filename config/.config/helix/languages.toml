# ~/.config/helix/languages.toml
#
# Global default for Python = basedpyright (types) + ruff (lint/format).
# Both respect each project's own config: ruff reads pyproject.toml/ruff.toml,
# basedpyright reads [tool.basedpyright]/pyrightconfig.json and AUTO-DETECTS the
# project's ./.venv -- so `cd <worktree>; $EDITOR .` picks up the right interpreter
# with no direnv.
#
# Per-repo override: drop a `.helix/languages.toml` in a repo (it's merged with
# this file and lives in the repo tree, so all worktrees inherit it). Example to
# use mypy in a specific repo via pylsp:
#   [language-server.pylsp.config.pylsp.plugins.pylsp_mypy]
#   enabled = true
#   live_mode = true
#   [[language]]
#   name = "python"
#   language-servers = ["basedpyright", "ruff", "pylsp"]

# ---------- Python ----------
[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
# "workspace" (not "openFilesOnly") so find-references/rename see files that aren't
# currently open (e.g. a test importing a symbol). Heavier CPU/RAM on large repos.
diagnosticMode = "workspace"
typeCheckingMode = "standard"

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
language-servers = ["basedpyright", "ruff"]
auto-format = true

# ---------- Jinja ----------
[language-server.jinja-lsp]
command = "jinja-lsp"
config = { lang = "python" }
timeout = 5

[[language]]
name = "jinja"
language-servers = ["jinja-lsp"]

# ---------- Baseline languages ----------
# Servers (taplo / yaml-language-server / vscode-json-language-server /
# bash-language-server / marksman) come from Helix's built-in language config;
# they activate automatically now that the binaries are on PATH. Here we only
# turn on format-on-save and wire the shell formatter.

[[language]]
name = "toml"
auto-format = true

[[language]]
name = "json"
auto-format = true

[[language]]
name = "yaml"
auto-format = true

[[language]]
name = "bash"
auto-format = true
formatter = { command = "shfmt", args = ["-i", "2", "-ci", "-"] }
