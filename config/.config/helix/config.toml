# ~/.config/helix/config.toml
theme = "catppuccin_mocha_dim"

[editor]
line-number = "relative"
mouse = true
cursorline = true
color-modes = true               # colored mode indicator in the statusline
true-color = true
bufferline = "multiple"          # show the bufferline only when >1 buffer is open
rulers = [100]
text-width = 100
end-of-line-diagnostics = "hint"
completion-replace = true        # accepting a completion replaces the whole word, not just inserts
trim-trailing-whitespace = true  # strip trailing spaces (only on Helix's own saves)

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
]
center = []
right = [
  "diagnostics",
  "selections",
  "register",
  "position",
  "total-line-numbers",
  "position-percentage",
  "file-encoding",
  "file-line-ending",
  "file-type",
]
separator = "│"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false # show dotfiles in the built-in picker (space+f)

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "error"

[editor.soft-wrap]
enable = false

[editor.indent-guides]
render = true
character = "╎"

# NOTE: no file-picker keybind here on purpose.
# Yazi is summoned from zellij (Alt-y) and routes files into this instance,
# so the editor needs no picker config. Built-in fallbacks remain:
#   space+f  fuzzy file picker      space+b  buffer picker
#   space+e  file explorer (25.07)  space+/  global search

# ---------- Keybindings ----------
# Move the current line -- or the whole selection -- up/down. Helix has no native
# command for this, so it's the community delete+paste idiom (works for single
# lines and multi-line selections; repeatable). Ctrl+arrows because zellij's
# locked mode already owns Alt+h/j/k/l and Alt+arrows.
# NOTE: this uses the default yank register, so it overwrites what you last yanked.
[keys.normal]
C-up = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]
C-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
# Re-read files from disk (Helix has no autoreload) -- handy after opencode edits them.
C-r = ":reload-all"

# "+" opens a small toggles/tools menu (leaves the Space menu untouched).
[keys.normal."+"]
f = ":format"                                      # format the whole file (LSP)
s = ":toggle soft-wrap.enable"                     # soft-wrap on/off
l = ":toggle lsp.display-inlay-hints"              # inlay type hints on/off (can be noisy)
d = ":toggle end-of-line-diagnostics hint disable" # show/hide end-of-line diagnostic text (harper grammar etc.)
y = ":yank-diagnostic"                              # copy diagnostic under cursor to the system clipboard
w = ":set whitespace.render all"                   # show whitespace (tabs/spaces/newlines)
W = ":set whitespace.render none"                  # hide whitespace again
g = ":sh bash $HOME/.config/helix/git-hunk.sh '%{buffer_name}' %{cursor_line}" # peek the git-diff hunk under the cursor (floating delta pane)

# "g u" -- go up to the overridden method in the parent class (Python).
# Helix has no LSP type-hierarchy jump, so this shells out to a small Jedi
# script that walks the MRO and returns the ancestor's definition, then :open
# jumps there. The script declares its deps inline (PEP 723) and runs via uv
# (nothing to pre-install); it points Jedi at the project's .venv so base
# classes from dependencies resolve too. :write first so Jedi reads on-disk
# content; %{buffer_name} is relative to Helix's cwd, which the shell inherits.
# No super-method found -> cursor stays put.
[keys.normal.g]
u = [
  ":write",
  ":open %sh{uv run --script $HOME/.config/helix/goto-super.py '%{buffer_name}' %{cursor_line} %{cursor_column}}",
]

[keys.select]
C-up = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]
C-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
