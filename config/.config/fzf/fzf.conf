# fzf options -- loaded via FZF_DEFAULT_OPTS_FILE (set in the dotfiles .zshrc block).
#
# Alt-g toggles .gitignore filtering for fzf's file list (Yazi's `z`, shell Ctrl-T, ...).
# The current mode is stored in the prompt, so one key can flip between:
#   git>   respect .gitignore   (fd default; hides .venv, .mypy_cache, __pycache__, ...)
#   all>   show everything      ($FZF_DEFAULT_COMMAND + --no-ignore)
# Alt-g (not Ctrl-g) because zellij's locked mode intercepts Ctrl-g.
--prompt='git> '
--bind='alt-g:transform:[[ $FZF_PROMPT == git* ]] && echo "change-prompt(all> )+reload($FZF_DEFAULT_COMMAND --no-ignore)" || echo "change-prompt(git> )+reload($FZF_DEFAULT_COMMAND)"'
